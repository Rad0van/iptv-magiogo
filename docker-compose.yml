services:
  iptv-magiogo:
    build: .
    image: ghcr.io/rad0van/iptv-magiogo:latest
    restart: always
    env_file:
      - .env
    ports:
      - "4589:4589"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      MAGIO_USERNAME: ${MAGIO_USERNAME}
      MAGIO_PASSWORD: ${MAGIO_PASSWORD}
      HOST: ${HOST}
      # Optional device label in your Magio account (defaults to the hostname).
      MAGIO_DEVICE_NAME: ${MAGIO_DEVICE_NAME:-}
